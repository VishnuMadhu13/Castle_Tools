apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: castle-tools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VishnuMadhu13/Castle_Tools.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: castle-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
