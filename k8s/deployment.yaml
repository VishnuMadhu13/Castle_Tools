apiVersion: apps/v1
kind: Deployment
metadata:
  name: castle-tools
  labels:
    app: castle-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: castle-tools
  template:
    metadata:
      labels:
        app: castle-tools
    spec:
      initContainers:
        - name: db-migrate
          image: vishnumadhu13/castle-tools:latest
          command: ["node_modules/.bin/drizzle-kit", "migrate"]
          envFrom:
            - secretRef:
                name: castle-tools-secrets
      containers:
        - name: castle-tools
          image: vishnumadhu13/castle-tools:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: castle-tools-secrets
          env:
            - name: AUTH_TRUST_HOST
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: castle-tools
spec:
  type: NodePort
  selector:
    app: castle-tools
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300