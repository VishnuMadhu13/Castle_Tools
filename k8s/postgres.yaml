apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: castle-postgres-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: castle-postgres
  labels:
    app: castle-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: castle-postgres
  template:
    metadata:
      labels:
        app: castle-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: credvault
            - name: POSTGRES_USER
              value: credvault
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: castle-tools-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "credvault", "-d", "credvault"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: castle-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: castle-postgres
spec:
  selector:
    app: castle-postgres
  ports:
    - port: 5432
      targetPort: 5432
