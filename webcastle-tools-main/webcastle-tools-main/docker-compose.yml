services:
  postgres:
    image: postgres:17-alpine
    container_name: credvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: credvault
      POSTGRES_PASSWORD: credvault
      POSTGRES_DB: credvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credvault -d credvault"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
